<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" font-family="'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" style="background: #ffffff;">
  <defs>
    <marker id="arrowhead-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e88e5"/>
    </marker>
    <marker id="arrowhead-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#43a047"/>
    </marker>
    <marker id="arrowhead-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#78909c"/>
    </marker>
  </defs>

  <!-- Lifelines -->
  <g stroke="#cfd8dc" stroke-width="1.5" stroke-dasharray="6 4">
    <line x1="140" y1="60" x2="140" y2="570"/>
    <line x1="320" y1="60" x2="320" y2="570"/>
    <line x1="500" y1="60" x2="500" y2="570"/>
    <line x1="680" y1="60" x2="680" y2="570"/>
    <line x1="860" y1="60" x2="860" y2="570"/>
  </g>

  <!-- Header rects -->
  <g stroke-width="1.5">
    <rect x="85" y="24" width="110" height="36" rx="6" fill="#e3f2fd" stroke="#90caf9"/>
    <text x="140" y="46" font-size="12" fill="#1565c0" text-anchor="middle">spec 需求定义</text>

    <rect x="265" y="24" width="110" height="36" rx="6" fill="#e3f2fd" stroke="#90caf9"/>
    <text x="320" y="46" font-size="12" fill="#1565c0" text-anchor="middle">plan 技术设计</text>

    <rect x="445" y="24" width="110" height="36" rx="6" fill="#e3f2fd" stroke="#90caf9"/>
    <text x="500" y="46" font-size="12" fill="#1565c0" text-anchor="middle">tasks→build 实施</text>

    <rect x="625" y="24" width="110" height="36" rx="6" fill="#e8f5e9" stroke="#a5d6a7"/>
    <text x="680" y="46" font-size="12" fill="#2e7d32" text-anchor="middle">review 产物审查</text>

    <rect x="805" y="24" width="110" height="36" rx="6" fill="#e8f5e9" stroke="#a5d6a7"/>
    <text x="860" y="46" font-size="12" fill="#2e7d32" text-anchor="middle">validate 产物验证</text>
  </g>

  <!-- Arrow 1: spec -> plan -->
  <line x1="140" y1="120" x2="320" y2="120" stroke="#1e88e5" stroke-width="2" marker-end="url(#arrowhead-blue)"/>
  <text x="230" y="112" font-size="12" fill="#37474f" text-anchor="middle">spec.md</text>

  <!-- Arrow 2: plan -> tasks -->
  <line x1="320" y1="180" x2="500" y2="180" stroke="#1e88e5" stroke-width="2" marker-end="url(#arrowhead-blue)"/>
  <text x="410" y="172" font-size="12" fill="#37474f" text-anchor="middle">plan.md + ADR</text>

  <!-- Parallel zone -->
  <rect x="655" y="160" width="230" height="140" rx="4" fill="#f5f5f5" stroke="#bdbdbd" stroke-dasharray="4 3"/>
  <text x="770" y="176" font-size="11" fill="#78909c" text-anchor="middle" font-style="italic">∥ 可与 tasks→build 并行</text>
  <line x1="680" y1="195" x2="840" y2="195" stroke="#78909c" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowhead-gray)"/>
  <text x="700" y="190" font-size="11" fill="#37474f">设计 C1~CN</text>
  <line x1="860" y1="215" x2="700" y2="215" stroke="#78909c" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowhead-gray)"/>
  <text x="790" y="238" font-size="11" fill="#37474f">设计 V1~VN · 编写脚本</text>

  <!-- Arrow 3: tasks -> build vertical progression -->
  <g>
    <line x1="500" y1="210" x2="500" y2="246" stroke="#1e88e5" stroke-width="2" marker-end="url(#arrowhead-blue)"/>
    <text x="508" y="230" font-size="11" fill="#37474f">tasks.json</text>
  </g>

  <!-- Arrow 4: build -> review -->
  <line x1="500" y1="280" x2="680" y2="280" stroke="#1e88e5" stroke-width="2" marker-end="url(#arrowhead-blue)"/>
  <text x="590" y="272" font-size="12" fill="#37474f" text-anchor="middle">产物 + build.md</text>

  <!-- Arrow 5: review -> validate -->
  <line x1="680" y1="380" x2="860" y2="380" stroke="#43a047" stroke-width="2" marker-end="url(#arrowhead-green)"/>
  <text x="770" y="372" font-size="12" fill="#37474f" text-anchor="middle">review.md + review-report.md</text>

  <!-- Arrow 6: validate self-loop -->
  <path d="M 860 450 C 895 450, 895 480, 860 480" fill="none" stroke="#43a047" stroke-width="2" marker-end="url(#arrowhead-green)"/>
  <text x="912" y="468" font-size="11" fill="#37474f" text-anchor="middle">validate.md</text>
  <text x="912" y="482" font-size="11" fill="#37474f" text-anchor="middle">+ validate-report.md</text>

  <!-- Activation bars -->
  <g fill="#bbdefb" stroke="#90caf9" stroke-width="1">
    <rect x="134" y="100" width="12" height="40" rx="2"/>
    <rect x="314" y="140" width="12" height="60" rx="2"/>
    <rect x="494" y="180" width="12" height="70" rx="2"/>
  </g>
  <g fill="#a5d6a7" stroke="#66bb6a" stroke-width="1">
    <rect x="674" y="160" width="12" height="240" rx="2"/>
    <rect x="854" y="160" width="12" height="320" rx="2"/>
  </g>

  <!-- Bottom annotation -->
  <text x="450" y="580" font-size="12" fill="#37474f" text-anchor="middle">→ 正向建设流（spec→plan→tasks→build）  →  逆向检验流（review→validate）  ∥ 策略设计可与 build 并行</text>
</svg>
