<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" font-family="'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="112%" height="118%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowDown" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 0 L 5 8 z" fill="#90a4ae"/>
    </marker>
  </defs>

  <text x="280" y="46" text-anchor="middle" font-size="17" font-weight="bold" fill="#c62828">改造前 ❌</text>
  <text x="820" y="46" text-anchor="middle" font-size="17" font-weight="bold" fill="#2e7d32">改造后 ✅</text>

  <g filter="url(#shadow)">
    <rect x="30" y="20" width="500" height="380" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="1.5"/>
    <rect x="570" y="20" width="500" height="380" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="1.5"/>
    <rect x="150" y="430" width="800" height="52" rx="10" fill="#fafafa" stroke="#e0e0e0" stroke-width="1.5"/>
  </g>

  <path d="M30,28 A8,8 0 0 1 38,20 H522 A8,8 0 0 1 530,28 V62 H30 Z" fill="#ffcdd2"/>
  <path d="M570,28 A8,8 0 0 1 578,20 H1062 A8,8 0 0 1 1070,28 V62 H570 Z" fill="#c8e6c9"/>

  <line x1="550" y1="20" x2="550" y2="400" stroke="#90a4ae" stroke-width="3"/>
  <text x="550" y="214" text-anchor="middle" font-size="32" font-weight="bold" fill="#607d8b">→</text>

  <g stroke-linejoin="round">
    <rect x="46" y="74" width="468" height="95" rx="6" fill="#bbdefb" stroke="#90caf9" stroke-width="1.5"/>
    <rect x="586" y="74" width="468" height="95" rx="6" fill="#bbdefb" stroke="#90caf9" stroke-width="1.5"/>
    <rect x="46" y="183" width="468" height="95" rx="6" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="1.5"/>
    <rect x="586" y="183" width="468" height="95" rx="6" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1.5"/>
    <rect x="46" y="292" width="468" height="95" rx="6" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="1.5"/>
    <rect x="586" y="292" width="468" height="95" rx="6" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1.5"/>
  </g>

  <g font-weight="bold" fill="#ffffff">
    <rect x="46" y="74" width="80" height="95" fill="#42a5f5"/>
    <text x="86" y="126" text-anchor="middle" font-size="15">plan</text>
    <rect x="586" y="74" width="80" height="95" fill="#42a5f5"/>
    <text x="626" y="126" text-anchor="middle" font-size="15">plan</text>
    <rect x="46" y="183" width="80" height="95" fill="#bdbdbd"/>
    <text x="86" y="235" text-anchor="middle" font-size="15">review</text>
    <rect x="586" y="183" width="80" height="95" fill="#81c784"/>
    <text x="626" y="235" text-anchor="middle" font-size="15">review</text>
    <rect x="46" y="292" width="80" height="95" fill="#bdbdbd"/>
    <text x="86" y="344" text-anchor="middle" font-size="15">validate</text>
    <rect x="586" y="292" width="80" height="95" fill="#81c784"/>
    <text x="626" y="344" text-anchor="middle" font-size="15">validate</text>
  </g>

  <g fill="#37474f">
    <text x="142" y="112" font-size="15">技术设计</text>
    <text x="142" y="221" font-size="15">读取 plan §5.8 → 被动审查</text>
    <text x="142" y="330" font-size="15">读取 plan §5.9 → 被动验证</text>
    <text x="682" y="112" font-size="15" font-weight="bold">纯技术设计</text>
    <text x="682" y="221" font-size="15" font-weight="bold" fill="#1b5e20">自主定义 C1~CN 审查清单</text>
    <text x="682" y="330" font-size="15" font-weight="bold" fill="#1b5e20">自主定义 V1~VN 验证场景</text>
  </g>

  <g fill="#546e7a">
    <text x="682" y="136" font-size="12.5">§5.1~§5.7 架构分析 / 方案对比 / ADR</text>
    <text x="682" y="245" font-size="12.5">从 spec + plan + 产物中提取审查对象</text>
    <text x="682" y="354" font-size="12.5">从 spec + NFR + 产物中提取验证对象</text>
    <text x="142" y="245" font-size="12.5">无自主策略</text>
  </g>

  <text x="142" y="136" font-size="13" font-weight="bold" fill="#d32f2f">代笔 §5.8 审查策略 + §5.9 验证策略</text>
  <text x="142" y="354" font-size="12.5" font-weight="bold" fill="#d32f2f">33% 验证场景无法执行</text>

  <rect x="422" y="107.5" width="76" height="28" rx="14" fill="#d32f2f"/>
  <text x="460" y="126.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">越界</text>
  <rect x="974" y="107.5" width="64" height="28" rx="14" fill="#2e7d32"/>
  <text x="1006" y="126.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">回归</text>

  <line x1="390" y1="170" x2="390" y2="182" stroke="#90a4ae" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrowDown)"/>

  <g font-size="12.5" fill="#455a64">
    <rect x="220" y="449" width="14" height="14" rx="3" fill="#bbdefb" stroke="#90caf9" stroke-width="1.5"/>
    <text x="242" y="460">蓝色 = plan（技术设计方）</text>
    <rect x="430" y="449" width="14" height="14" rx="3" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1.5"/>
    <text x="452" y="460">灰色 = 被动消费（改造前）</text>
    <rect x="640" y="449" width="14" height="14" rx="3" fill="#e8f5e9" stroke="#81c784" stroke-width="1.5"/>
    <text x="662" y="460">绿色 = 自主策略（改造后）</text>
    <rect x="845" y="449" width="14" height="14" rx="3" fill="#d32f2f"/>
    <text x="867" y="460">红色 = 越界代笔</text>
  </g>
</svg>
