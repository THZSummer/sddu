<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1540 400" width="1540" height="400" font-family="'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <!-- Start circle -->
  <g>
    <circle cx="85" cy="185" r="30" fill="#e0e0e0" stroke="#9e9e9e" stroke-width="1.5"/>
    <text x="85" y="184" font-size="11" fill="#333" text-anchor="middle">Feature</text>
    <text x="85" y="201" font-size="12" fill="#333" text-anchor="middle">创建</text>
  </g>

  <!-- End circle -->
  <g>
    <circle cx="1500" cy="185" r="30" fill="#e0e0e0" stroke="#9e9e9e" stroke-width="1.5"/>
    <circle cx="1500" cy="185" r="24" fill="none" stroke="#9e9e9e" stroke-width="1.2"/>
    <text x="1500" y="183" font-size="11" fill="#333" text-anchor="middle">终态</text>
    <text x="1500" y="200" font-size="9.5" fill="#333" text-anchor="middle">completed</text>
  </g>

  <!-- Arrows -->
  <g stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arrow)">
    <line x1="115" y1="185" x2="138" y2="185"/>
    <line x1="260" y1="185" x2="306" y2="185"/>
    <line x1="428" y1="185" x2="474" y2="185"/>
    <line x1="596" y1="185" x2="642" y2="185"/>
    <line x1="764" y1="185" x2="810" y2="185"/>
    <line x1="932" y1="185" x2="978" y2="185"/>
    <line x1="1100" y1="185" x2="1146" y2="185"/>
    <line x1="1268" y1="185" x2="1314" y2="185"/>
    <line x1="1436" y1="185" x2="1465" y2="185"/>
  </g>

  <!-- Phase nodes -->
  <g>
    <!-- registered (stage 0) -->
    <rect x="140" y="150" width="120" height="70" rx="10" fill="#e0e0e0" stroke="#9e9e9e" stroke-width="1.5"/>
    <text x="200" y="178" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">registered</text>
    <text x="200" y="196" font-size="12" fill="#333" text-anchor="middle">阶段 0</text>
    <text x="200" y="211" font-size="10" fill="#999" text-anchor="middle">—</text>

    <!-- discovered (stage 1) -->
    <rect x="308" y="150" width="120" height="70" rx="10" fill="#bbdefb" stroke="#1e88e5" stroke-width="1.5"/>
    <text x="368" y="178" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">discovered</text>
    <text x="368" y="196" font-size="12" fill="#333" text-anchor="middle">阶段 1</text>
    <text x="368" y="211" font-size="10" fill="#666" text-anchor="middle">@sddu-discovery</text>

    <!-- specified (stage 2) -->
    <rect x="476" y="150" width="120" height="70" rx="10" fill="#bbdefb" stroke="#1e88e5" stroke-width="1.5"/>
    <text x="536" y="178" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">specified</text>
    <text x="536" y="196" font-size="12" fill="#333" text-anchor="middle">阶段 2</text>
    <text x="536" y="211" font-size="10" fill="#666" text-anchor="middle">@sddu-spec</text>

    <!-- planned (stage 3) -->
    <rect x="644" y="150" width="120" height="70" rx="10" fill="#fff9c4" stroke="#f9a825" stroke-width="2.5"/>
    <circle cx="659" cy="165" r="5" fill="#f9a825"/>
    <text x="704" y="178" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">planned</text>
    <text x="704" y="196" font-size="12" fill="#333" text-anchor="middle">阶段 3</text>
    <text x="704" y="211" font-size="10" fill="#666" text-anchor="middle">@sddu-plan</text>

    <!-- tasked (stage 4) -->
    <rect x="812" y="150" width="120" height="70" rx="10" fill="#bbdefb" stroke="#1e88e5" stroke-width="1.5"/>
    <text x="872" y="178" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">tasked</text>
    <text x="872" y="196" font-size="12" fill="#333" text-anchor="middle">阶段 4</text>
    <text x="872" y="211" font-size="10" fill="#666" text-anchor="middle">@sddu-tasks</text>

    <!-- builded (stage 5) -->
    <rect x="980" y="150" width="120" height="70" rx="10" fill="#bbdefb" stroke="#1e88e5" stroke-width="1.5"/>
    <text x="1040" y="178" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">builded</text>
    <text x="1040" y="196" font-size="12" fill="#333" text-anchor="middle">阶段 5</text>
    <text x="1040" y="211" font-size="10" fill="#666" text-anchor="middle">@sddu-build</text>

    <!-- reviewed (stage 6) -->
    <rect x="1148" y="150" width="120" height="70" rx="10" fill="#fff9c4" stroke="#f9a825" stroke-width="2.5"/>
    <circle cx="1163" cy="165" r="5" fill="#f9a825"/>
    <text x="1208" y="178" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">reviewed</text>
    <text x="1208" y="196" font-size="12" fill="#333" text-anchor="middle">阶段 6</text>
    <text x="1208" y="211" font-size="10" fill="#666" text-anchor="middle">@sddu-review</text>

    <!-- validated (stage 7) -->
    <rect x="1316" y="150" width="120" height="70" rx="10" fill="#fff9c4" stroke="#f9a825" stroke-width="2.5"/>
    <circle cx="1331" cy="165" r="5" fill="#f9a825"/>
    <text x="1376" y="178" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">validated</text>
    <text x="1376" y="196" font-size="12" fill="#333" text-anchor="middle">阶段 7</text>
    <text x="1376" y="211" font-size="10" fill="#666" text-anchor="middle">@sddu-validate</text>
  </g>

  <!-- Arrow labels -->
  <g font-size="10" fill="#555" text-anchor="middle">
    <text x="284" y="143">@sddu-discovery</text>
    <text x="452" y="143">@sddu-spec</text>
    <text x="620" y="143">@sddu-plan</text>
    <text x="788" y="143">@sddu-tasks</text>
    <text x="956" y="143">@sddu-build</text>
    <text x="1124" y="143">@sddu-review</text>
    <text x="1292" y="143">@sddu-validate</text>
  </g>

  <!-- Legend -->
  <g>
    <line x1="40" y1="260" x2="1500" y2="260" stroke="#d5d5d5" stroke-width="1.5"/>
    <rect x="48" y="273" width="14" height="14" rx="3" fill="#bbdefb" stroke="#1e88e5"/>
    <text x="70" y="285" font-size="12" fill="#555">🟢 普通阶段</text>
    <rect x="215" y="273" width="14" height="14" rx="3" fill="#fff9c4" stroke="#f9a825"/>
    <text x="237" y="285" font-size="12" fill="#555">🟡 本 Feature 聚焦：plan 剥离越界职责，review/validate 自主定义策略</text>
    <text x="712" y="285" font-size="12" fill="#555">单向不可逆推进 →</text>
  </g>
</svg>
